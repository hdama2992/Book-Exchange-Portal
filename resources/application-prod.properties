# ====================================
# Production Environment Configuration
# ====================================

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Use PostgreSQL in production)
# Uncomment below for PostgreSQL and comment out SQLite
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQLite Database Configuration (Production - single file)
spring.datasource.url=jdbc:sqlite:${DB_PATH:books_exchange.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (MUST be set via environment variable in production)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging (Minimal in production)
logging.level.org.springframework.security=WARN
logging.level.com.books.exchange=INFO
logging.level.org.hibernate.SQL=WARN

# OpenAPI / Swagger Configuration (Disabled in production)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS Configuration (Restrict to specific domains)
cors.allowed-origins=${ALLOWED_ORIGINS:https://yourdomain.com}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

