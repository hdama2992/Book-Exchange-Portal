# ====================================
# Book Exchange Portal - Main Configuration
# ====================================
# This file contains common settings for all environments.
# Environment-specific settings are in:
#   - application-dev.properties (development)
#   - application-prod.properties (production)
#
# To run with a specific profile:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   or set: SPRING_PROFILES_ACTIVE=prod

# Default profile (if not specified)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Info
spring.application.name=Book Exchange Portal
info.app.name=Book Exchange Portal
info.app.version=1.0.0
info.app.description=A platform for book lovers to exchange books

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:${DB_PATH:books_exchange.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Use environment variable in production!)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=${UPLOAD_PATH:uploads}

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.com.books.exchange=${LOG_LEVEL_APP:DEBUG}

# OpenAPI / Swagger Configuration
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Email Configuration (Gmail example - use app password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:5175}

# Async Configuration (for email sending)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
